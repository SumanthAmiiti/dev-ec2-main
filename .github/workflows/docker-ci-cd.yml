
name: Docker CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Get project source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run project tests
      - name: Run Tests
        run: npm test

      # 5. Create lowercase Docker image name
      - name: Set Image Name
        id: image
        run: |
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 6. Setup Docker
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Build Docker image and publish it
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # 9. Deploy latest GHCR image through Railway
      - name: Deploy to Railway
        if: github.event_name == 'push'
        run: |
          npm install -g @railway/cli
          railway redeploy --service dev-ec2-main --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

